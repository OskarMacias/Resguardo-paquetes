<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control y Registro de Paquetes</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --success: #16a34a;
      --warning: #d97706;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 24px;
      color: #0f172a;
    }

    .grid-container {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
    }

    @media (max-width: 850px) {
      .grid-container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 1.25rem;
      margin-bottom: 16px;
      color: #334155;
      border-bottom: 2px solid var(--bg);
      padding-bottom: 8px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
      transition: background 0.2s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    .btn-action {
      padding: 6px 12px;
      font-size: 0.85rem;
      width: auto;
      background-color: var(--success);
    }

    .btn-action:hover {
      background-color: #15803d;
    }

    .stats-container {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
    }

    .stat-box {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      background: #f1f5f9;
    }

    .stat-box.success {
      background: #dcfce7;
      color: #14532d;
    }

    .stat-box.warning {
      background: #fef3c7;
      color: #78350f;
    }

    .stat-number {
      font-size: 1.5rem;
      font-weight: bold;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.9rem;
    }

    th, td {
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid var(--border);
    }

    th {
      background-color: #f8fafc;
      color: #64748b;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
      display: inline-block;
    }

    .badge-resguardo {
      background: #fef3c7;
      color: #b45309;
    }

    .badge-entregado {
      background: #dcfce7;
      color: #15803d;
    }

    .empty-message {
      text-align: center;
      color: #94a3b8;
      padding: 20px;
    }
  </style>
</head>
<body>

  <h1>📦 Control de Paquetes Resguardados y Entregados</h1>

  <div class="grid-container">
    
    <!-- COLUMNA IZQUIERDA: REGISTRO Y BÚSQUEDA POR PERSONA -->
    <div>
      <!-- Registrar Paquete -->
      <div class="card">
        <h2>Registrar Nuevo Paquete</h2>
        <form id="packageForm">
          <div class="form-group">
            <label for="personName">Nombre de la persona</label>
            <input type="text" id="personName" placeholder="Ej. Juan Pérez" required>
          </div>
          <div class="form-group">
            <label for="description">Descripción del paquete</label>
            <input type="text" id="description" placeholder="Ej. Caja Amazon, Sobre verde" required>
          </div>
          <div class="form-group">
            <label for="status">Estado inicial</label>
            <select id="status">
              <option value="Resguardado">En resguardo</option>
              <option value="Entregado">Entregado / Firmado</option>
            </select>
          </div>
          <div class="form-group">
            <label for="entryDate">Fecha de ingreso / firma</label>
            <input type="datetime-local" id="entryDate" required>
          </div>
          <button type="submit">Guardar Registro</button>
        </form>
      </div>

      <!-- Buscar por Persona -->
      <div class="card">
        <h2>Consultar por Persona</h2>
        <div class="form-group">
          <label for="searchPerson">Nombre de la persona</label>
          <input type="text" id="searchPerson" placeholder="Escribe un nombre..." oninput="searchPersonPackages()">
        </div>

        <div id="searchResults" style="display: none;">
          <div class="stats-container">
            <div class="stat-box success">
              <div>Firmados / Entregados</div>
              <div class="stat-number" id="statSigned">0</div>
            </div>
            <div class="stat-box warning">
              <div>En Resguardo</div>
              <div class="stat-number" id="statPending">0</div>
            </div>
          </div>

          <h3>Historial del Destinatario:</h3>
          <div style="overflow-x: auto;">
            <table>
              <thead>
                <tr>
                  <th>Descripción</th>
                  <th>Estado</th>
                  <th>Fecha Firma</th>
                </tr>
              </thead>
              <tbody id="searchTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- COLUMNA DERECHA: REGISTRO GENERAL -->
    <div>
      <div class="card">
        <h2>Listado General de Paquetes</h2>
        <div style="overflow-x: auto;">
          <table>
            <thead>
              <tr>
                <th>Persona</th>
                <th>Descripción</th>
                <th>Estado</th>
                <th>Fecha Ingreso</th>
                <th>Fecha Firma/Entrega</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody id="generalTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <script>
    // Base de datos local simulada
    let packages = JSON.parse(localStorage.getItem('packages_data')) || [];

    // Establecer fecha y hora actual por defecto en el formulario
    document.addEventListener('DOMContentLoaded', () => {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      document.getElementById('entryDate').value = now.toISOString().slice(0, 16);
      renderTables();
    });

    // Guardar paquete
    document.getElementById('packageForm').addEventListener('submit', (e) => {
      e.preventDefault();

      const name = document.getElementById('personName').value.trim();
      const description = document.getElementById('description').value.trim();
      const status = document.getElementById('status').value;
      const entryDate = document.getElementById('entryDate').value;

      const newPackage = {
        id: Date.now(),
        person: name,
        description: description,
        status: status,
        entryDate: entryDate,
        signedDate: status === 'Entregado' ? entryDate : null
      };

      packages.push(newPackage);
      saveData();
      renderTables();

      // Limpiar formulario excepto la fecha
      document.getElementById('personName').value = '';
      document.getElementById('description').value = '';
      document.getElementById('status').value = 'Resguardado';
    });

    // Cambiar estado a "Entregado/Firmado"
    function markAsDelivered(id) {
      const pkg = packages.find(p => p.id === id);
      if (pkg) {
        pkg.status = 'Entregado';
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        pkg.signedDate = now.toISOString().slice(0, 16);
        saveData();
        renderTables();
        searchPersonPackages(); // Actualizar búsqueda activa
      }
    }

    // Guardar en localStorage
    function saveData() {
      localStorage.setItem('packages_data', JSON.stringify(packages));
    }

    // Formatear fechas
    function formatDate(dateStr) {
      if (!dateStr) return '---';
      const date = new Date(dateStr);
      return date.toLocaleString('es-ES', { 
        year: 'numeric', month: '2-digit', day: '2-digit', 
        hour: '2-digit', minute: '2-digit' 
      });
    }

    // Renderizar tabla general
    function renderTables() {
      const tbody = document.getElementById('generalTableBody');
      tbody.innerHTML = '';

      if (packages.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="empty-message">No hay paquetes registrados aún.</td></tr>`;
        return;
      }

      // Ordenar por más recientes primero
      [...packages].reverse().forEach(pkg => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${pkg.person}</strong></td>
          <td>${pkg.description}</td>
          <td>
            <span class="badge ${pkg.status === 'Entregado' ? 'badge-entregado' : 'badge-resguardo'}">
              ${pkg.status}
            </span>
          </td>
          <td>${formatDate(pkg.entryDate)}</td>
          <td>${formatDate(pkg.signedDate)}</td>
          <td>
            ${pkg.status === 'Resguardado' 
              ? `<button class="btn-action" onclick="markAsDelivered(${pkg.id})">Firmar / Entregar</button>` 
              : '✅ Entregado'}
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Buscar y calcular totales por persona
    function searchPersonPackages() {
      const query = document.getElementById('searchPerson').value.trim().toLowerCase();
      const resultsContainer = document.getElementById('searchResults');
      const tbody = document.getElementById('searchTableBody');

      if (!query) {
        resultsContainer.style.display = 'none';
        return;
      }

      const filtered = packages.filter(p => p.person.toLowerCase().includes(query));

      if (filtered.length === 0) {
        resultsContainer.style.display = 'block';
        document.getElementById('statSigned').textContent = '0';
        document.getElementById('statPending').textContent = '0';
        tbody.innerHTML = `<tr><td colspan="3" class="empty-message">No se encontraron registros para esta persona.</td></tr>`;
        return;
      }

      const signedCount = filtered.filter(p => p.status === 'Entregado').length;
      const pendingCount = filtered.filter(p => p.status === 'Resguardado').length;

      document.getElementById('statSigned').textContent = signedCount;
      document.getElementById('statPending').textContent = pendingCount;

      tbody.innerHTML = '';
      filtered.forEach(pkg => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${pkg.description}</td>
          <td>
            <span class="badge ${pkg.status === 'Entregado' ? 'badge-entregado' : 'badge-resguardo'}">
              ${pkg.status}
            </span>
          </td>
          <td>${formatDate(pkg.signedDate)}</td>
        `;
        tbody.appendChild(tr);
      });

      resultsContainer.style.display = 'block';
    }
  </script>
</body>
</html>
